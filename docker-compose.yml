services:
  postgres:
    image: postgres:16
    container_name: cti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cti_dashboard
      POSTGRES_USER: cti_user
      POSTGRES_PASSWORD: cti_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
